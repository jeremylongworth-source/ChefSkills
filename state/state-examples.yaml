    target_state:
      safety: lower-sodium cabbage product with safe preservation assumptions
    safety_gate:
      status: professional_review_required
      reason: reducing required salt in fermented sauerkraut changes safety and texture controls and needs a tested recipe
    likely_mechanism: salt favors desired fermentation microbes and inhibits others while supporting texture
    intervention:
      type: rework
      action: do not cut required sauerkraut salt; use a tested lower-sodium recipe, refrigerated quick pickle, or smaller serving strategy
    verification_cue: plan uses tested proportions and does not depend on an unverified reduced-salt ferment

  - id: soft-fermented-pickles
    surface:
      - ingredient_state
      - dish_state
      - observation_state
      - recovery_state
      - safety_state
    safety_relevant: true
    task_context: troubleshooting
    workflow_stage: discard
    current_observation:
      food: fermented cucumber pickles
      texture: soft and slippery
      aroma: unpleasant
    target_state:
      safety: avoid eating spoiled fermented pickles
    safety_gate:
      status: discard
      reason: soft slippery texture and disagreeable odor indicate possible spoilage that rinsing cannot make safe
    likely_mechanism: weak brine, high fermentation temperature, poor submersion, old cucumbers, or microbial spoilage
    intervention:
      type: discard
      action: do not rinse or continue fermenting; discard and correct brine, submersion, temperature, and produce quality next batch
    verification_cue: next batch remains submerged, smells cleanly sour, and stays firm without slime

  - id: kombucha-bottle-pressure
    surface:
      - equipment_state
      - workflow_state
      - transformation_state
      - observation_state
      - safety_state
    safety_relevant: true
    task_context: preservation
    workflow_stage: storage
    current_observation:
      beverage: kombucha
      container: sealed bottles
      pressure: very fizzy with bulging cap
    target_state:
      safety: controlled carbonation without bottle explosion risk
    safety_gate:
      status: time_limited
      reason: gas-producing fermentation in sealed containers can create pressure hazards and needs monitoring and refrigeration
    likely_mechanism: residual sugar and warm storage continue fermentation and carbon dioxide production in a sealed vessel
    intervention:
      type: chill
      action: refrigerate to slow fermentation when safe to handle, avoid uncontrolled airtight storage, and adjust sugar time temperature and venting next batch
    verification_cue: bottles show no bulging, pressure is managed, and finished kombucha is promptly refrigerated

