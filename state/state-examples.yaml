examples_version: 0.1
examples:
  - id: broken-mayonnaise
    surface:
      - dish_state
      - transformation_state
      - observation_state
      - recovery_state
    safety_relevant: false
    task_context: troubleshooting
    workflow_stage: recovery
    current_observation:
      visual: oily and separated
      texture: loose
    target_state:
      texture: stable emulsion
    likely_mechanism: emulsion failure
    intervention:
      type: emulsify
      action: restart emulsion into a fresh water-phase base
    verification_cue: glossy, thick, stable sauce with no free oil

  - id: thin-gravy
    surface:
      - dish_state
      - transformation_state
      - observation_state
      - recovery_state
    safety_relevant: false
    task_context: troubleshooting
    workflow_stage: recovery
    current_observation:
      texture: too thin
      visual: runs off spoon
    target_state:
      texture: lightly coats spoon
    likely_mechanism: insufficient reduction or starch gelatinization
    intervention:
      type: thicken
      action: reduce or add a cooked starch slurry in stages
    verification_cue: nappes the back of a spoon

  - id: oversalted-soup
    surface:
      - dish_state
      - ingredient_state
      - observation_state
      - recovery_state
    safety_relevant: false
    task_context: troubleshooting
    workflow_stage: recovery
    current_observation:
      taste: too salty
    target_state:
      flavor: balanced salt concentration
    likely_mechanism: seasoning concentration too high
    intervention:
      type: dilute
      action: add unsalted liquid or bulk ingredients in stages
    verification_cue: salt perception drops without flattening flavor

  - id: chicken-counter-overnight
    surface:
      - ingredient_state
      - workflow_state
      - safety_state
    safety_relevant: true
    task_context: preservation
    workflow_stage: storage
    current_observation:
      food: cooked chicken
      time: overnight at room temperature
    target_state:
      safety: safe to eat
    safety_gate:
      status: discard
      reason: time and temperature abuse cannot be fixed by reheating
    intervention:
      type: discard
      action: do not eat
    verification_cue: not applicable; safety decision overrides recovery

  - id: sauce-for-forty
    surface:
      - dish_state
      - equipment_state
      - workflow_state
      - recovery_state
    safety_relevant: false
    task_context: scaling
    workflow_stage: planning
    current_observation:
      yield: 4 portions
    target_state:
      yield: 40 portions
    likely_mechanism: volume and surface area change reduction behavior
    intervention:
      type: rework
      action: scale ingredients, batch reduction, and season gradually
    verification_cue: sauce reaches target consistency and seasoning after batching

  - id: gluten-free-cake
    surface:
      - ingredient_state
      - dish_state
      - transformation_state
      - recovery_state
    safety_relevant: false
    task_context: substitution
    workflow_stage: planning
    current_observation:
      constraint: no wheat flour
    target_state:
      texture: tender cake with stable crumb
    likely_mechanism: gluten structure and hydration change
    intervention:
      type: rework
      action: choose flour blend, binder, and hydration adjustment
    verification_cue: batter viscosity and baked crumb are stable

  - id: low-sodium-soup
    surface:
      - ingredient_state
      - dish_state
      - safety_state
    safety_relevant: true
    task_context: substitution
    workflow_stage: planning
    current_observation:
      constraint: lower sodium needed
    target_state:
      flavor: balanced with less salt
    safety_gate:
      status: professional_review_required
      reason: medical diet constraints may require clinician guidance
    intervention:
      type: season
      action: use acid, herbs, aromatics, and umami while labeling assumptions
    verification_cue: flavor remains balanced without relying on high sodium

  - id: large-pot-stock-cooling
    surface:
      - equipment_state
      - workflow_state
      - safety_state
    safety_relevant: true
    task_context: preservation
    workflow_stage: cooling
    current_observation:
      food: large pot of chicken stock
      state: hot
    target_state:
      safety: cooled and stored safely
    safety_gate:
      status: time_limited
      reason: large volumes cool slowly and need active cooling
    intervention:
      type: chill
      action: divide into shallow containers or use an ice bath before refrigeration
    verification_cue: stock reaches safe chilled storage state promptly

  - id: gummy-rice
    surface:
      - ingredient_state
      - transformation_state
      - observation_state
      - recovery_state
    safety_relevant: false
    task_context: troubleshooting
    workflow_stage: recovery
    current_observation:
      texture: gummy and clumped
    target_state:
      texture: distinct grains
    likely_mechanism: excess surface starch or too much water/agitation
    intervention:
      type: rework
      action: spread, steam off moisture, or repurpose if texture cannot recover
    verification_cue: grains separate more easily or dish is redirected

  - id: searing-vs-braising
    surface:
      - transformation_state
      - equipment_state
      - observation_state
    safety_relevant: false
    task_context: learning
    workflow_stage: planning
    current_observation:
      question: which meat cooking method fits the result
    target_state:
      decision: choose technique based on cut and desired texture
    likely_mechanism: dry heat browning versus moist heat tenderization
    intervention:
      type: adjust_heat
      action: select sear, roast, simmer, or braise by cut and target texture
    verification_cue: selected method matches browning, moisture, and tenderness goal

  - id: no-oven-lasagna
    surface:
      - equipment_state
      - workflow_state
      - dish_state
    safety_relevant: false
    task_context: substitution
    workflow_stage: planning
    current_observation:
      missing_equipment: oven
    target_state:
      dish: lasagna-style result without baking
    likely_mechanism: equipment changes heat direction and browning
    intervention:
      type: rework
      action: use stovetop assembly, covered heating, and optional broiler substitute if available
    verification_cue: pasta is tender, filling hot, sauce absorbed, and top finish adjusted

  - id: garlic-oil-storage
    surface:
      - ingredient_state
      - workflow_state
      - safety_state
    safety_relevant: true
    task_context: preservation
    workflow_stage: storage
    current_observation:
      food: fresh garlic in oil
      storage: room temperature
    target_state:
      safety: safe infused oil storage
    safety_gate:
      status: unsafe
      reason: low-oxygen oil storage with fresh garlic is safety-critical
    intervention:
      type: discard
      action: do not store fresh garlic in oil at room temperature
    verification_cue: safe storage method replaces counter storage

  - id: buttermilk-substitution
    surface:
      - ingredient_state
      - dish_state
      - transformation_state
    safety_relevant: false
    task_context: substitution
    workflow_stage: planning
    current_observation:
      missing_ingredient: buttermilk
      available_ingredient: regular milk
    target_state:
      dish: tender pancakes with proper rise and mild tang
    likely_mechanism: acidity affects leavening, tenderness, and flavor
    intervention:
      type: acidify
      action: adjust milk with acid or rebalance leavening
    verification_cue: batter consistency and pancake lift remain appropriate

  - id: tomato-sauce-flat
    surface:
      - dish_state
      - ingredient_state
      - observation_state
      - recovery_state
    safety_relevant: false
    task_context: troubleshooting
    workflow_stage: recovery
    current_observation:
      taste: flat after simmering
    target_state:
      flavor: balanced salt acid sweetness umami fat and concentration
    likely_mechanism: flavor perception is under-balanced rather than simply undercooked
    intervention:
      type: season
      action: adjust salt, acid, umami, aromatics, or fat in small stages
    verification_cue: sauce tastes brighter and fuller without becoming salty or sweet

  - id: evaluate-ai-sushi-recipe
    surface:
      - ingredient_state
      - dish_state
      - safety_state
    safety_relevant: true
    task_context: safety_review
    workflow_stage: planning
    current_observation:
      food: raw grocery-store salmon for home sushi
      process: unknown sourcing and handling
    target_state:
      safety: raw fish served only with adequate sourcing and handling controls
    safety_gate:
      status: professional_review_required
      reason: raw fish safety depends on sourcing, parasite controls, storage, and handling
    intervention:
      type: rework
      action: use safer alternatives or verified raw-service fish sourcing
    verification_cue: safety decision is based on verified process, not freshness claims

  - id: thanksgiving-oven-plan
    surface:
      - equipment_state
      - workflow_state
      - safety_state
    safety_relevant: true
    task_context: planning
    workflow_stage: planning
    current_observation:
      equipment: one oven with multiple dishes
      foods: turkey, stuffing, green beans, rolls, and pie
    target_state:
      service: safe turkey and coherent oven timing
    safety_gate:
      status: time_limited
      reason: turkey, stuffing, holding, and reheating require safety-aware timing
    intervention:
      type: rework
      action: sequence oven use, resting, holding, and reheating around safety constraints
    verification_cue: hot foods reach safe service state without impossible oven overlaps

  - id: split-pan-sauce
    surface:
      - dish_state
      - transformation_state
      - observation_state
      - recovery_state
    safety_relevant: false
    task_context: troubleshooting
    workflow_stage: recovery
    current_observation:
      visual: greasy with butterfat pooling
      texture: broken after butter was whisked in
    target_state:
      texture: glossy stable pan sauce
    likely_mechanism: butter emulsion failure from excess heat, fat load, or low water phase
    intervention:
      type: emulsify
      action: lower heat, add liquid in drops, whisk to rebuild the water phase, and finish fat gradually
    verification_cue: sauce coats a spoon, looks glossy, and has no free oil at the edge

  - id: dense-banana-bread
    surface:
      - ingredient_state
      - dish_state
      - transformation_state
      - observation_state
      - recovery_state
    safety_relevant: false
    task_context: troubleshooting
    workflow_stage: recovery
    current_observation:
      texture: dense and gummy center
      visual: compact crumb
    target_state:
      texture: tender quick bread with set center and open crumb
    likely_mechanism: excess moisture, underbaking, weak leavening, pan load, or overmixing
    intervention:
      type: rework
      action: adjust banana or liquid load, verify leavening, mix less, manage pan fill, and bake to center-set cues
    verification_cue: center springs back, tester has moist crumbs rather than wet batter, and cooled crumb is not gummy

  - id: dry-chicken-breast
    surface:
      - ingredient_state
      - transformation_state
      - observation_state
      - recovery_state
      - safety_state
    safety_relevant: true
    task_context: troubleshooting
    workflow_stage: recovery
    current_observation:
      food: chicken breast
      texture: dry and fibrous
      safety_need: safe doneness required
    target_state:
      texture: juicy cooked chicken with verified safe endpoint
    safety_gate:
      status: professional_review_required
      reason: safe endpoint depends on current authoritative temperature guidance and thermometer verification
    likely_mechanism: moisture loss from excess heat, uneven thickness, and carryover after lean protein denaturation
    intervention:
      type: adjust_heat
      action: use thermometer-guided cooking, gentler heat, even thickness, resting, and sauce or slicing recovery
    verification_cue: safe endpoint is verified by thermometer and texture stays juicy after rest

  - id: curdled-cream-pan-sauce
    surface:
      - dish_state
      - transformation_state
      - observation_state
      - recovery_state
    safety_relevant: false
    task_context: troubleshooting
    workflow_stage: recovery
    current_observation:
      visual: grainy cream sauce after lemon and boiling
      texture: curdled and rough
    target_state:
      texture: smooth lightly coating sauce
    likely_mechanism: dairy proteins destabilized by high heat and acid
    intervention:
      type: rework
      action: lower heat, add liquid or fat gradually, whisk, strain if needed, or rebuild if curdling is irreversible
    verification_cue: sauce looks smooth, coats a spoon, and has no grainy curds

  - id: raw-egg-aioli-pregnant
    surface:
      - ingredient_state
      - dish_state
      - workflow_state
      - safety_state
    safety_relevant: true
    task_context: recipe_creation
    workflow_stage: planning
    current_observation:
      food: homemade aioli with raw egg
      diner: pregnant guest
    target_state:
      safety: sauce safe for a higher-risk diner
    safety_gate:
      status: professional_review_required
      reason: raw or lightly cooked egg for pregnancy is safety-critical and should use current authoritative guidance
    intervention:
      type: rework
      action: avoid raw unpasteurized egg and use pasteurized, store-bought, or cooked-base alternatives
    verification_cue: sauce plan does not depend on raw unpasteurized egg, acid alone, or freshness claims for safety

  - id: collapsed-layer-cake
    surface:
      - ingredient_state
      - dish_state
      - transformation_state
      - observation_state
      - recovery_state
    safety_relevant: false
    task_context: troubleshooting
    workflow_stage: recovery
    current_observation:
      visual: cake rose then sank
      texture: dense ring near center
    target_state:
      texture: stable layer cake with set center and even crumb
    likely_mechanism: overleavening, underbaking, weak structure, inaccurate oven heat, or early movement
    intervention:
      type: rework
      action: check leavening amount, mix to proper structure, verify oven temperature, avoid early door opening, and bake to center-set cues
    verification_cue: center springs back, tester has moist crumbs, and cake cools without sinking

  - id: cookies-spread-too-much
    surface:
      - ingredient_state
      - dish_state
      - transformation_state
      - observation_state
      - recovery_state
    safety_relevant: false
    task_context: troubleshooting
    workflow_stage: recovery
    current_observation:
      visual: cookies spread into thin greasy puddles
      texture: flat greasy edges
    target_state:
      texture: cookies with controlled spread, set centers, and crisp edges
    likely_mechanism: warm fat, low flour ratio, high sugar, insufficient hydration rest, hot pan, or weak dough structure
    intervention:
      type: rework
      action: chill dough, measure flour, control butter state, adjust sugar or hydration, and bake on a cool lined pan
    verification_cue: cookies spread gradually, edges set, centers remain soft but not greasy, and shape holds after cooling

  - id: tough-beef-braise
    surface:
      - ingredient_state
      - transformation_state
      - observation_state
      - recovery_state
    safety_relevant: false
    task_context: troubleshooting
    workflow_stage: active_cooking
    current_observation:
      food: chuck roast braise
      texture: tough and dry after hours
    target_state:
      texture: fork-tender moist shreds or slices
    likely_mechanism: collagen may not be fully converted, or lean exposed sections may have dried before connective tissue softened
    intervention:
      type: extend_time
      action: continue a covered gentle braise if connective tissue is still tough, or stop and sauce thin slices if lean meat is already dry
    verification_cue: fork slides in with little resistance and meat separates into moist strands without chalky fibers

  - id: fish-doneness-safety
    surface:
      - ingredient_state
      - transformation_state
      - observation_state
      - recovery_state
      - safety_state
    safety_relevant: true
    task_context: recipe_creation
    workflow_stage: active_cooking
    current_observation:
      food: thick salmon fillets
      goal: moist texture and safe doneness
    target_state:
      texture: moist fish with verified safe endpoint
    safety_gate:
      status: professional_review_required
      reason: fish endpoint should use current authoritative guidance, thermometer verification, and diner-risk awareness
    intervention:
      type: adjust_heat
      action: use gentler heat, thermometer or source-checked doneness guidance, carryover awareness, and opaque flaking cues
    verification_cue: safe endpoint is verified and flesh is opaque, separates easily, and remains moist
