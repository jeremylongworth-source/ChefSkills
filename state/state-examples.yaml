      flavor: tastes good
      proposed_change: add vinegar and store in pantry
    target_state:
      safety: stored hot sauce with verified refrigeration or shelf-stable process
    safety_gate:
      status: professional_review_required
      reason: taste and casual vinegar addition do not prove shelf stability; pantry storage needs tested proportions, verified acidity, and tested processing directions
    likely_mechanism: blending, added ingredients, oxygen exposure, salt, acidity, and heat processing change fermentation and storage risk
    intervention:
      type: store
      action: refrigerate the sauce unless using a tested hot-sauce canning recipe or source-checked shelf-stable process with verified pH and processing controls
    verification_cue: storage method is refrigerated or follows a tested shelf-stable process, and the decision is not based on taste alone
